<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Volvo Ad — 728x90</title>
    <link rel="stylesheet" href="../styles/common.css" />
    <script src="../scripts/car-drive.js" defer></script>
    <style>
      body {
        width: 728px;
        height: 90px;
      }

      .ad {
        --volvo-bg-angle: 135deg;
        --car-width: 200px;
        --car-bottom: 2px;
        --car-edge-buffer: 24px;
        --car-stop-x: 15px;
        width: 728px;
        height: 90px;
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 0 24px;
      }

      .logo-panel {
        animation: fade-in 0.6s ease both;
      }

      .message {
        flex: 1;
        animation: slide-right 0.8s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .cta {
        z-index: 2;
        padding: 0 20px;
      }
    </style>
  </head>
  <body>
    <div
      class="ad"
      onclick="
        window.open('%%CLICK_URL_UNESC%%https://volvocars.com', '_blank')
      "
    >
      <div class="logo-panel">
        <img
          class="volvo-logo"
          src="../assets/svg/volvo-logo.svg"
          alt="Volvo"
        />
      </div>

      <div class="message">
        <div class="eyebrow">EX90 · Pure electric</div>
        <div class="headline">Beautifully safe.</div>
      </div>

      <button class="cta">Explore</button>

      <div class="car-stage">
        <img
          class="car-image"
          src="../assets/png/volvo-car.png"
          alt="Volvo EX90"
        />
      </div>
    </div>
  </body>
</html>
