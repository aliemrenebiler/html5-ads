<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Åhlens Ad — 160x600</title>
    <link rel="stylesheet" href="../styles/common.css" />
    <style>
      body {
        width: 160px;
        height: 600px;
      }

      .ad {
        --offer-size: 80px;
        --offer-pct-size: 20px;
        --offer-off-size: 12px;
        --product-label-size: 15px;
        --product-discount-size: 12px;
        --headline-size: 20px;
        --headline-line-height: 1.25;
        width: 160px;
        height: 600px;
        background: var(--ahlens-bg-warm);
        display: flex;
        flex-direction: column;
      }

      /* Logo header */
      .header {
        width: 100%;
        padding: 30px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--ahlens-border);
      }

      .header::after {
        content: "";
        background: repeating-linear-gradient(
          90deg,
          transparent,
          transparent 10px,
          var(--ahlens-pattern-muted) 10px,
          var(--ahlens-pattern-muted) 11px
        );
      }

      .logo {
        display: flex;
        z-index: 1;
        animation: fade-in 0.6s ease both;
      }

      .ahlens-logo {
        width: 112px;
      }

      .season-tag {
        background: var(--ahlens-red);
        padding: 3px 10px;
        font-family: "Arial", sans-serif;
        font-size: 8px;
        color: #fff;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        z-index: 1;
        animation: fade-in 0.7s 0.1s ease both;
      }

      /* Product showcase */
      .showcase {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        animation: fade-in 0.8s 0.2s ease both;
      }

      .product-card {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px 10px;
        border-block: 1px solid var(--ahlens-border);
      }

      .product-card + .product-card {
        border-top: none;
      }

      /* Content bottom */
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 16px 16px;
        gap: 16px;
        animation: slide-up 0.8s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* Divider */
      .divider {
        width: 100%;
        height: 1px;
        background: var(--ahlens-border);
        margin-bottom: 14px;
      }

      /* CTA */
      .cta {
        width: 100%;
        height: 36px;
        letter-spacing: 0.18em;
        margin-top: auto;
        animation: fade-in 0.8s 0.7s ease both;
      }
    </style>
  </head>
  <body>
    <div
      class="ad"
      onclick="window.open('%%CLICK_URL_UNESC%%https://ahlens.se', '_blank')"
    >
      <div class="header">
        <div class="logo">
          <img
            class="ahlens-logo"
            src="../assets/svg/ahlens-logo.svg"
            alt="Åhléns"
          />
        </div>
        <span class="season-tag">Summer sale</span>
      </div>

      <div class="content">
        <div class="headline">Beautiful things, better prices.</div>

        <div class="offer-circle">
          <span class="pct">-30%</span>
          <span class="off">off</span>
        </div>
      </div>

      <div class="showcase">
        <div class="product-card">
          <div class="product-label">Home & Living</div>
          <div class="product-discount">Up to -40%</div>
        </div>
        <div class="product-card">
          <div class="product-label">Women & Men</div>
          <div class="product-discount">Up to -30%</div>
        </div>
        <div class="product-card">
          <div class="product-label">Skin & Care</div>
          <div class="product-discount">Up to -25%</div>
        </div>
      </div>

      <button class="cta">Shop now</button>
    </div>
  </body>
</html>
